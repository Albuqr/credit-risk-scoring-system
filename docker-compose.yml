version: '3.8'
services:
  api:
    build: .
    ports:
      - '8000:8000'
    volumes:
      - credit-data:/app/data
      - credit-models:/app/models
    environment:
      - PYTHONPATH=/app
    restart: unless-stopped
  dashboard:
    build: .
    command: streamlit run dashboard/app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - '8501:8501'
    volumes:
      - credit-data:/app/data
      - credit-models:/app/models
    environment:
      - PYTHONPATH=/app
    depends_on:
      - api

volumes:
  credit-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/credit-risk-data
  credit-models:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/credit-risk-data/models
